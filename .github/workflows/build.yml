name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild so the image picks up base-image and Alpine package patches
    # and a fresh CryptoStorm server list. Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Docker Hardened Images are free but dhi.io still requires a Docker Hub login.
  # Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets to build on
  # the hardened base; without them the build falls back to public Alpine.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DHI_BASE: dhi.io/alpine-base:3.22-dev
  FALLBACK_BASE: alpine:3.22

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck
        run: shellcheck -x -s bash entrypoint.sh healthcheck.sh lib/*.sh build/*.sh tests/*.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Choose base image
        id: base
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "image=$DHI_BASE" >> "$GITHUB_OUTPUT"
            echo "Using hardened base $DHI_BASE"
          else
            echo "image=$FALLBACK_BASE" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME secret not set; building on $FALLBACK_BASE instead of the hardened base"
          fi

      - name: Log in to dhi.io
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cryptostorm-wg:ci
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: tests/smoke.sh cryptostorm-wg:ci

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-from: type=gha

      # GitHub pauses scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow from inside a scheduled run resets
      # that clock. Best effort; GitHub still emails if it ever pauses.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yml --repo "${{ github.repository }}"
